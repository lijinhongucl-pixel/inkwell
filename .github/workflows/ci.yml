name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

      - name: ruff check (编码守卫)
        # 单独一条、不并进上面的 select：PLW1514 目前仍在 preview 阶段，
        # 全局打开 preview 会让 lint 结果随 ruff 版本漂移。
        # 它拦的是「文件读写漏写 encoding="utf-8"」——这类缺陷在 macOS / Linux
        # 上永远暴露不出来，只会在 Windows 上炸成 UnicodeDecodeError。
        run: ruff check --preview --select PLW1514 src/ tests/

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --cov=inkwell --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    name: Build & Install Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install built wheel in a clean env
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/inkwell --help
          /tmp/verify/bin/inkwell themes

      - name: Check bundled assets
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["inkwell/screenshot.js", "inkwell/py.typed"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel 缺少必要资源: {missing}")
          print("wheel 资源检查通过:", required)
          PY

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: inkwell:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
